# Shared Celery Redis transport knobs (ingest/storage/beat/api/mq_consumer).
# Code defaults live in packages/agric_satellite_analysis_common; these let .env override them.
x-celery-redis-env: &celery-redis-env
  CELERY_BROKER_VISIBILITY_TIMEOUT: ${CELERY_BROKER_VISIBILITY_TIMEOUT:-7200}
  CELERY_REDIS_SOCKET_TIMEOUT: ${CELERY_REDIS_SOCKET_TIMEOUT:-5}
  CELERY_REDIS_SOCKET_CONNECT_TIMEOUT: ${CELERY_REDIS_SOCKET_CONNECT_TIMEOUT:-5}
  CELERY_REDIS_SOCKET_KEEPALIVE: ${CELERY_REDIS_SOCKET_KEEPALIVE:-true}
  CELERY_REDIS_RETRY_ON_TIMEOUT: ${CELERY_REDIS_RETRY_ON_TIMEOUT:-true}
  CELERY_REDIS_HEALTH_CHECK_INTERVAL: ${CELERY_REDIS_HEALTH_CHECK_INTERVAL:-25}
  CELERY_BROKER_CONNECTION_MAX_RETRIES: ${CELERY_BROKER_CONNECTION_MAX_RETRIES:-0}

services:
  # ── Postgres + PostGIS ──────────────────────────────────────────────
  db:
    # imresamu/postgis = multi-arch (amd64 + arm64) build of postgis/postgis,
    # which publishes amd64 only and cannot run on ARM hosts (Ampere/Apple)
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      --save "900 1"
      --save "300 10"
      --save "60 10000"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI (API service) ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *celery-redis-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENFARM_JWT_SECRET: ${OPENFARM_JWT_SECRET}
      STORAGE_BACKEND: oss
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      STAC_API_URL: ${STAC_API_URL}
      S1_STAC_API_URL: ${S1_STAC_API_URL:-https://planetarycomputer.microsoft.com/api/stac/v1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-agric-satellite-analysis <noreply@openfarm.earth>}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      MQ_FALLBACK_CELERY: ${MQ_FALLBACK_CELERY:-0}
      WORK_QUEUE_MODE: ${WORK_QUEUE_MODE:-legacy}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      WORK_LEASE_SECONDS: ${WORK_LEASE_SECONDS:-600}
      WORK_CLAIM_DEFAULT_LIMIT: ${WORK_CLAIM_DEFAULT_LIMIT:-1}
      WORK_REAPER_ON_CLAIM: ${WORK_REAPER_ON_CLAIM:-1}
      OPENFARM_SCRATCH_DIR: /data/scratch
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://llm-7cudikcfvgf9l1hy.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen3.7-flash}

      CDFINANCE_SOIL_BASE_URL: ${CDFINANCE_SOIL_BASE_URL:-https://joint-venture.cdfinance.com.cn/agric-api}
      CDFINANCE_APP_KEY: ${CDFINANCE_APP_KEY:-83f94deg-k4d3-5gc4-0a6d-fd995a6f03g5}
      CDFINANCE_CHANNEL_NET: ${CDFINANCE_CHANNEL_NET:-H5}
      CDFINANCE_HR_BASE_ID: ${CDFINANCE_HR_BASE_ID:-38}
      CDFINANCE_ORIGIN: ${CDFINANCE_ORIGIN:-https://joint-venture.cdfinance.com.cn}
      CDFINANCE_REFERER: ${CDFINANCE_REFERER:-https://joint-venture.cdfinance.com.cn/}
      CDFINANCE_SOIL_TIMEOUT_SECONDS: ${CDFINANCE_SOIL_TIMEOUT_SECONDS:-60}
    volumes:
      - scratch:/data/scratch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery ingest (foreign download + raster compute) ─────────────
  # Replaces legacy ``processor``. Queue: ingest. See docs/design/ingest-storage-split.md
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    command: >
      celery -A app.worker worker
      -Q ingest
      --loglevel=info
      --concurrency=4
    environment:
      <<: *celery-redis-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_BACKEND: oss
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      STAC_API_URL: ${STAC_API_URL}
      S1_STAC_API_URL: ${S1_STAC_API_URL:-https://planetarycomputer.microsoft.com/api/stac/v1}
      SOILGRIDS_WCS_BASE_URL: ${SOILGRIDS_WCS_BASE_URL}
      POLARIS_S3_BUCKET: ${POLARIS_S3_BUCKET}
      SOIL_FETCH_TIMEOUT_SECONDS: ${SOIL_FETCH_TIMEOUT_SECONDS}
      SOIL_FETCH_MAX_WORKERS: ${SOIL_FETCH_MAX_WORKERS:-12}
      SOIL_SOURCE_PRIORITY: ${SOIL_SOURCE_PRIORITY}
      INGEST_SCENE_MAX_WORKERS: ${INGEST_SCENE_MAX_WORKERS:-16}
      INGEST_BAND_MAX_WORKERS: ${INGEST_BAND_MAX_WORKERS:-16}
      WRITE_INDEX_COGS: ${WRITE_INDEX_COGS:-}
      UPLOAD_SCENE_JSON: ${UPLOAD_SCENE_JSON:-1}
      DECLOUD_ENABLED: ${DECLOUD_ENABLED:-0}
      DECLOUD_MODE: ${DECLOUD_MODE:-batch}
      DECLOUD_CLOUD_MIN_PCT: ${DECLOUD_CLOUD_MIN_PCT:-30}
      DECLOUD_STAC_CLOUD_MAX_PCT: ${DECLOUD_STAC_CLOUD_MAX_PCT:-100}
      DECLOUD_BACKEND: ${DECLOUD_BACKEND:-uncrtaints}
      DECLOUD_INPUT_T: ${DECLOUD_INPUT_T:-3}
      DECLOUD_USE_SAR: ${DECLOUD_USE_SAR:-1}
      DECLOUD_CACHE_DIR: ${DECLOUD_CACHE_DIR:-}
      UNCRTAINTS_CHECKPOINT_DIR: ${UNCRTAINTS_CHECKPOINT_DIR:-}
      UNCRTAINTS_HOME: ${UNCRTAINTS_HOME:-}
      UNCRTAINTS_CHECKPOINT_NAME: ${UNCRTAINTS_CHECKPOINT_NAME:-diagonal_1}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      OPENFARM_SCRATCH_DIR: /data/scratch
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://llm-7cudikcfvgf9l1hy.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen3.7-flash}
    volumes:
      - scratch:/data/scratch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker inspect ping --timeout 5 2>/dev/null | grep -q OK",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery storage (Aliyun OSS uploads only) ──────────────────────
  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    command: >
      celery -A app.worker worker
      -Q storage
      --loglevel=info
      --concurrency=2
    environment:
      <<: *celery-redis-env
      REDIS_URL: ${REDIS_URL}
      STORAGE_BACKEND: oss
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      OPENFARM_SCRATCH_DIR: /data/scratch
    volumes:
      - scratch:/data/scratch
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker inspect ping --timeout 5 2>/dev/null | grep -q OK",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat（ingest 镜像，定时任务投到 ingest 队列）──────────
  # 单实例：只在下载机跑，禁止和第二套 beat 同时存在。
  beat:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    command: >
      celery -A app.beat beat
      --loglevel=info
    environment:
      <<: *celery-redis-env
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy

  # ── Next.js (Web UI) ──────────────────────────────────────────────
  web:
    build:
      # The frontend is a sibling repository in the workspace layout.
      context: ../agric-satellite-analysis-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/v1}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_PROTOMAPS_URL: ${NEXT_PUBLIC_PROTOMAPS_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_DEMO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-false}
        NEXT_PUBLIC_GLOSSARY_ASSET_BASE: ${NEXT_PUBLIC_GLOSSARY_ASSET_BASE:-}
        NEXT_PUBLIC_OSS_URL: ${NEXT_PUBLIC_OSS_URL:-}
    healthcheck:
      # 静态镜像由 Nginx 提供服务，使用内置 wget 检查首页是否可读。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── CloudAMQP outer bus: download consumer (profile: consumer) ─────
  #   docker compose --profile consumer up -d mq_consumer
  mq_consumer:
    profiles: ["consumer", "mq"]
    build:
      context: .
      dockerfile: services/mq_consumer/Dockerfile
    environment:
      <<: *celery-redis-env
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      STORAGE_BACKEND: oss
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # ── CloudAMQP outer bus: process writer (profile: producer) ────────
  #   docker compose --profile producer up -d mq_result_writer
  mq_result_writer:
    profiles: ["producer", "mq"]
    build:
      context: .
      dockerfile: services/mq_result_writer/Dockerfile
    environment:
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      STORAGE_BACKEND: oss
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:
  redisdata:
  scratch:
