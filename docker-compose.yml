# Shared Celery Redis transport knobs (ingest/storage/beat/api/mq_consumer).
# Code defaults live in packages/openfarm_common; these let .env override them.
x-celery-redis-env: &celery-redis-env
  CELERY_BROKER_VISIBILITY_TIMEOUT: ${CELERY_BROKER_VISIBILITY_TIMEOUT:-7200}
  CELERY_REDIS_SOCKET_TIMEOUT: ${CELERY_REDIS_SOCKET_TIMEOUT:-5}
  CELERY_REDIS_SOCKET_CONNECT_TIMEOUT: ${CELERY_REDIS_SOCKET_CONNECT_TIMEOUT:-5}
  CELERY_REDIS_SOCKET_KEEPALIVE: ${CELERY_REDIS_SOCKET_KEEPALIVE:-true}
  CELERY_REDIS_RETRY_ON_TIMEOUT: ${CELERY_REDIS_RETRY_ON_TIMEOUT:-true}
  CELERY_REDIS_HEALTH_CHECK_INTERVAL: ${CELERY_REDIS_HEALTH_CHECK_INTERVAL:-25}
  CELERY_BROKER_CONNECTION_MAX_RETRIES: ${CELERY_BROKER_CONNECTION_MAX_RETRIES:-0}

services:
  # ── Postgres + PostGIS ──────────────────────────────────────────────
  db:
    # imresamu/postgis = multi-arch (amd64 + arm64) build of postgis/postgis,
    # which publishes amd64 only and cannot run on ARM hosts (Ampere/Apple)
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      --save "900 1"
      --save "300 10"
      --save "60 10000"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (optional local object storage) ──────────────────────────
  # Not started by default. Enable with:
  #   docker compose --profile minio up
  # and set STORAGE_BACKEND=minio (plus TILER_* / AWS_* for TiTiler).
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Bootstrap (create bucket) ────────────────────────────────
  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc anonymous set download local/${MINIO_BUCKET}/basemap;
      mc anonymous set download local/${MINIO_BUCKET}/photos;
      exit 0;
      "

  # ── FastAPI (API service) ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      <<: *celery-redis-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENFARM_JWT_SECRET: ${OPENFARM_JWT_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      TITILER_PUBLIC_URL: ${TITILER_PUBLIC_URL:-http://localhost:8080}
      STAC_API_URL: ${STAC_API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-OpenFarm <noreply@openfarm.earth>}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      MQ_FALLBACK_CELERY: ${MQ_FALLBACK_CELERY:-0}
      OPENFARM_SCRATCH_DIR: /data/scratch
    volumes:
      - scratch:/data/scratch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery ingest (foreign download + raster compute) ─────────────
  # Replaces legacy ``processor``. Queue: ingest. See docs/design/ingest-storage-split.md
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    command: >
      celery -A app.worker worker
      -Q ingest
      --loglevel=info
      --concurrency=4
    environment:
      <<: *celery-redis-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      STAC_API_URL: ${STAC_API_URL}
      SOILGRIDS_WCS_BASE_URL: ${SOILGRIDS_WCS_BASE_URL}
      POLARIS_S3_BUCKET: ${POLARIS_S3_BUCKET}
      SOIL_FETCH_TIMEOUT_SECONDS: ${SOIL_FETCH_TIMEOUT_SECONDS}
      SOIL_FETCH_MAX_WORKERS: ${SOIL_FETCH_MAX_WORKERS:-12}
      SOIL_SOURCE_PRIORITY: ${SOIL_SOURCE_PRIORITY}
      INGEST_SCENE_MAX_WORKERS: ${INGEST_SCENE_MAX_WORKERS:-16}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      OPENFARM_SCRATCH_DIR: /data/scratch
    volumes:
      - scratch:/data/scratch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker inspect ping --timeout 5 2>/dev/null | grep -q OK",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery storage (OSS/MinIO uploads only) ───────────────────────
  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    command: >
      celery -A app.worker worker
      -Q storage
      --loglevel=info
      --concurrency=2
    environment:
      <<: *celery-redis-env
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      OPENFARM_SCRATCH_DIR: /data/scratch
    volumes:
      - scratch:/data/scratch
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker inspect ping --timeout 5 2>/dev/null | grep -q OK",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat (schedules → ingest queue) ────────────────────────
  beat:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: >
      celery -A app.worker beat
      --loglevel=info
    environment:
      <<: *celery-redis-env
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy

  # ── TiTiler ────────────────────────────────────────────────────────
  # Default: S3-compatible access to Aliyun OSS (same keys as OSS_*).
  # For local MinIO: --profile minio and set
  #   TILER_AWS_ACCESS_KEY_ID / TILER_AWS_SECRET_ACCESS_KEY /
  #   TILER_S3_ENDPOINT=minio:9000 TILER_AWS_VIRTUAL_HOSTING=FALSE TILER_AWS_HTTPS=NO
  tiler:
    build:
      context: ./services/tiler
      dockerfile: Dockerfile
    environment:
      OPENFARM_JWT_SECRET: ${OPENFARM_JWT_SECRET}
      AWS_ACCESS_KEY_ID: ${TILER_AWS_ACCESS_KEY_ID:-${OSS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${TILER_AWS_SECRET_ACCESS_KEY:-${OSS_ACCESS_KEY_SECRET}}
      AWS_S3_ENDPOINT: ${TILER_S3_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      AWS_VIRTUAL_HOSTING: ${TILER_AWS_VIRTUAL_HOSTING:-TRUE}
      AWS_HTTPS: ${TILER_AWS_HTTPS:-YES}
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      TITILER_API_CORS_ORIGINS: ${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js (Web UI) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_TITILER_URL: ${NEXT_PUBLIC_TITILER_URL}
        NEXT_PUBLIC_PROTOMAPS_URL: ${NEXT_PUBLIC_PROTOMAPS_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL}
        NEXT_PUBLIC_ENABLE_DEMO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-false}
        NEXT_PUBLIC_GLOSSARY_ASSET_BASE: ${NEXT_PUBLIC_GLOSSARY_ASSET_BASE:-}
        INTERNAL_API_URL: http://api:8000
    environment:
      # Next.js standalone binds to $HOSTNAME, which Docker sets to the
      # container ID; bind all interfaces so the healthcheck can reach it
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
      NEXT_PUBLIC_ENABLE_DEMO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-false}
      OPENFARM_JWT_SECRET: ${OPENFARM_JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_TITILER_URL: ${NEXT_PUBLIC_TITILER_URL}
      NEXT_PUBLIC_PROTOMAPS_URL: ${NEXT_PUBLIC_PROTOMAPS_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL}
      NEXT_PUBLIC_GLOSSARY_ASSET_BASE: ${NEXT_PUBLIC_GLOSSARY_ASSET_BASE:-}
      DATABASE_URL: ${DATABASE_URL_SYNC}
      INTERNAL_API_URL: http://api:8000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # the web image has no curl; probe with node's built-in fetch
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── CloudAMQP outer bus: download consumer (profile: consumer) ─────
  #   docker compose --profile consumer up -d mq_consumer
  mq_consumer:
    profiles: ["consumer", "mq"]
    build:
      context: .
      dockerfile: services/mq_consumer/Dockerfile
    environment:
      <<: *celery-redis-env
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # ── CloudAMQP outer bus: process writer (profile: producer) ────────
  #   docker compose --profile producer up -d mq_result_writer
  mq_result_writer:
    profiles: ["producer", "mq"]
    build:
      context: .
      dockerfile: services/mq_result_writer/Dockerfile
    environment:
      CLOUDAMQP_URL: ${CLOUDAMQP_URL:-}
      CLOUDAMQP_DOWNLOAD_QUEUE: ${CLOUDAMQP_DOWNLOAD_QUEUE:-${CLOUDAMQP_TASK_QUEUE:-openfarm_download}}
      CLOUDAMQP_PROCESS_QUEUE: ${CLOUDAMQP_PROCESS_QUEUE:-${CLOUDAMQP_RESULT_QUEUE:-openfarm_process}}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-s1s2_parcel/json/}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:
  redisdata:
  miniodata:
  scratch:
