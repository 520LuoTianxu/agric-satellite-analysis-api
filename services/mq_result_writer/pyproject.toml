[project]
name = "openfarm-mq-result-writer"
version = "0.1.0"
description = "CloudAMQP result consumer → OSS download → agri.mq_task_results"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pika>=1.3.0",
    "httpx>=0.27.0",
    "oss2>=2.18.0",
    "minio>=7.2.0",
    "structlog>=24.0.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
