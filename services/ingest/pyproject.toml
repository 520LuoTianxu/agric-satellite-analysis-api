[project]
name = "openfarm-ingest"
version = "0.1.0"
description = "OpenFarm ingest Celery worker (STAC / weather / soil / raster)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "geoalchemy2>=0.15.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "oss2>=2.18.0",
    "httpx>=0.27.0",
    "shapely>=2.0.0",
    "geojson>=3.0.0",
    "pyproj>=3.6.0",
    "redis>=5.0.0",
    "pystac-client>=0.7.0",
    "planetary-computer>=1.0.0",
    "rasterio>=1.3.0",
    "rio-cogeo>=5.0.0",
    "numpy>=1.26.0",
    "owslib>=0.31.0",
    "rosetta-soil>=0.3.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "pypdf>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.reports.land_assessment" = ["fonts/*.ttf"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
