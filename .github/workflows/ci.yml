name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  config:
    name: Config - env parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every documented variable reaches its consumer
        run: python3 scripts/check-env-parity.py

  common:
    name: Common - Celery Redis transport tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agric_satellite_analysis_common
        run: pip install -e packages/agric_satellite_analysis_common pytest
      - name: Unit tests
        run: python -m pytest packages/agric_satellite_analysis_common/tests -q

  ingest:
    name: Ingest - unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PDF 报告测试需要 pypdf 解析结果，并用 poppler 作为兼容性兜底。
      - name: Install PDF system tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # 测试会导入真实的栅格与空间模型，必须安装 ingest 项目声明的完整依赖。
      - name: Install ingest dependencies
        run: pip install -e packages/agric_satellite_analysis_common -e services/ingest
      - name: Unit tests
        run: PYTHONPATH=services/ingest python -m unittest discover -s services/ingest/tests -v

  api:
    name: API - lint (ruff) & tests
    runs-on: ubuntu-latest
    env:
      # database_sync 在导入时创建 Engine；测试只需合法 URL，不需要连接真实数据库。
      DATABASE_URL: postgresql+asyncpg://openfarm:openfarm_dev@localhost:5432/openfarm
      DATABASE_SCHEMA: agric_satellite
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ../../packages/agric_satellite_analysis_common -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
