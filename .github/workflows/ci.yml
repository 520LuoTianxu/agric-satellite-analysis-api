name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  config:
    name: Config - env parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every documented variable reaches its consumer
        run: python3 scripts/check-env-parity.py
      - name: Locale message keys match en.json
        run: python3 scripts/check-i18n-keys.py

  common:
    name: Common - Celery Redis transport tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install openfarm_common
        run: pip install -e packages/openfarm_common pytest
      - name: Unit tests
        run: python -m pytest packages/openfarm_common/tests -q

  ingest:
    name: Ingest - unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared task dependencies
        run: pip install -e packages/openfarm_common numpy pillow
      - name: Unit tests
        run: PYTHONPATH=services/ingest python -m unittest discover -s services/ingest/tests -v

  web:
    name: Web - zero-warning checks & production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # 使用与服务器一致的 Linux / Node 20 验证完整构建。
      - run: npm run build

  api:
    name: API - lint (ruff) & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - name: Install deps
        run: pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
