# Download machine: host networking; optional local Redis for Celery only.
# Production control plane: HTTP claim → joint-venture gateway (no CloudAMQP results).
# Runbook: docs/design/download-machine.md
# Design: docs/design/download-host-no-direct-pg-redis.md
# Cutover history: docs/design/work-queue-cutover.md
#
# Usage (claim is the download-machine default):
#   cp .env.example .env   # fill secrets + unique WORKER_NAME
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.download-machine.yml --profile consumer \
#     --profile local-redis \
#     up -d --build redis ingest satellite storage beat mq_consumer decloud
#
# REDIS_URL on this host MUST be localhost (Celery broker), never API :6379.
# Required .env (see .env.example "Download machine" section):
#   API_BASE_URL=https://joint-venture.cdfinance.com.cn/satellite-api
#   API_PATH_PREFIX=                    # empty — gateway has no /v1
#   INTERNAL_API_TOKEN=<same as API>
#   WORKER_NAME=download-<unique>       # unique per machine
#   WORK_QUEUE_MODE=claim
#   INGEST_PG_WRITES=0 / INGEST_PG_READS=0 / INGEST_HTTP_WRITES=1
#   DATABASE_URL= / DATABASE_URL_SYNC=  # blank on download host
#   CLOUDAMQP_RESULT_PUBLISH=0          # never reintroduce CloudAMQP results
#   OSS_ENDPOINT=https://{bucket}.oss-accelerate.aliyuncs.com
#
# Secrets stay in .env — never hard-code credentials here.

services:
  db:
    profiles: ["local-db"]
  redis:
    profiles: ["local-redis"]
  api:
    profiles: ["api"]
  web:
    profiles: ["web"]
  mq_result_writer:
    profiles: ["producer"]

  ingest:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    environment:
      # D2: prefer internal HTTP reads when set (writes still use DATABASE_URL until D3)
      API_BASE_URL: ${API_BASE_URL:-}
      # Only default when unset; empty string disables /v1 for public gateway.
      API_PATH_PREFIX: ${API_PATH_PREFIX-/v1}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Gateway TLS flakes: short connect + retries for get_job / progress / results/cache
      INTERNAL_API_HTTP_TIMEOUT_SEC: ${INTERNAL_API_HTTP_TIMEOUT_SEC:-30}
      INTERNAL_API_HTTP_CONNECT_TIMEOUT_SEC: ${INTERNAL_API_HTTP_CONNECT_TIMEOUT_SEC:-5}
      INTERNAL_API_HTTP_RETRIES: ${INTERNAL_API_HTTP_RETRIES:-3}
      INTERNAL_API_HTTP_RETRY_BACKOFF_SEC: ${INTERNAL_API_HTTP_RETRY_BACKOFF_SEC:-0.5}
      # Cap concurrent gateway calls + reuse keepalive (joint-venture TLS)
      INTERNAL_API_MAX_INFLIGHT: ${INTERNAL_API_MAX_INFLIGHT:-2}
      INTERNAL_API_MAX_CONNECTIONS: ${INTERNAL_API_MAX_CONNECTIONS:-4}
      INTERNAL_API_MAX_KEEPALIVE: ${INTERNAL_API_MAX_KEEPALIVE:-4}
      # Throttle per-job progress PATCH (seconds between updates)
      INTERNAL_API_PROGRESS_MIN_INTERVAL_SEC: ${INTERNAL_API_PROGRESS_MIN_INTERVAL_SEC:-45}
      INTERNAL_API_CACHE_BUFFER: ${INTERNAL_API_CACHE_BUFFER:-1}
      INTERNAL_API_CACHE_FLUSH_MAX: ${INTERNAL_API_CACHE_FLUSH_MAX:-8}
      INTERNAL_API_CACHE_FLUSH_SEC: ${INTERNAL_API_CACHE_FLUSH_SEC:-2}
      # D3: download host defaults to HTTP writes (no direct PG)
      INGEST_PG_WRITES: ${INGEST_PG_WRITES:-0}
      INGEST_PG_READS: ${INGEST_PG_READS:-0}
      INGEST_HTTP_WRITES: ${INGEST_HTTP_WRITES:-1}
      MPLCONFIGDIR: /tmp/matplotlib
      SYNC_DB_POOL_SIZE: "8"
      SYNC_DB_MAX_OVERFLOW: "8"
      SYNC_DB_POOL_RECYCLE: "300"
      SYNC_DB_APP_NAME: "download-ingest"
      INGEST_SCENE_MAX_WORKERS: "8"
      INGEST_SCENE_STRAGGLER_TIMEOUT_SEC: ${INGEST_SCENE_STRAGGLER_TIMEOUT_SEC:-600}
      SATELLITE_BATCH_SOFT_TIME_LIMIT_SEC: ${SATELLITE_BATCH_SOFT_TIME_LIMIT_SEC:-720}
      SATELLITE_BATCH_TIME_LIMIT_SEC: ${SATELLITE_BATCH_TIME_LIMIT_SEC:-780}
      SATELLITE_BATCH_SOFT_TIMEOUT_MAX_RETRIES: ${SATELLITE_BATCH_SOFT_TIMEOUT_MAX_RETRIES:-6}
      SATELLITE_BATCH_SOFT_TIMEOUT_RETRY_COUNTDOWN_SEC: ${SATELLITE_BATCH_SOFT_TIMEOUT_RETRY_COUNTDOWN_SEC:-30}
    volumes:
      - scratch:/data/scratch
      - ${OPENFARM_LOG_HOST_DIR:-./logs}:/data/logs
      - ${UNCRTAINTS_HOME_HOST:-/workspace/UnCRtainTS}:/opt/UnCRtainTS:ro
      - ${UNCRTAINTS_CHECKPOINT_HOST:-/workspace/UnCRtainTS/checkpoints}:/models/uncrtaints:ro
    command: >
      celery -A app.worker worker
      -Q cpu_compute,ingest
      -n cpu@%h
      --loglevel=info
      --concurrency=2

  # 卫星搜索/下载单独消费 satellite_download，不和 CPU/编排任务争抢 worker。
  satellite:
    extends:
      service: ingest
    depends_on: !reset []
    command: >
      celery -A app.worker worker
      -Q satellite_download
      -n satellite@%h
      --loglevel=info
      --concurrency=6

  # Separate queue so UnCRtainTS runs while optical shards keep downloading.
  # Same image as ingest; env comes from compose base + .env (no secrets here).
  decloud:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      SYNC_DB_POOL_SIZE: "4"
      SYNC_DB_MAX_OVERFLOW: "4"
      SYNC_DB_POOL_RECYCLE: "300"
      SYNC_DB_APP_NAME: "download-decloud"
      INGEST_SCENE_MAX_WORKERS: "2"
      # Standalone service (not an ingest override). In claim mode, API_BASE_URL /
      # INTERNAL_API_TOKEN come from .env and DATABASE_URL* intentionally stay blank;
      # decloud reads metadata over Internal HTTP and uses local Redis only as broker.
      REDIS_URL: ${REDIS_URL}
      CLOUDAMQP_RESULT_PUBLISH: ${CLOUDAMQP_RESULT_PUBLISH:-0}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CELERY_BROKER_VISIBILITY_TIMEOUT: ${CELERY_BROKER_VISIBILITY_TIMEOUT:-7200}
      CELERY_REDIS_SOCKET_TIMEOUT: ${CELERY_REDIS_SOCKET_TIMEOUT:-5}
      CELERY_REDIS_SOCKET_CONNECT_TIMEOUT: ${CELERY_REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      CELERY_REDIS_SOCKET_KEEPALIVE: ${CELERY_REDIS_SOCKET_KEEPALIVE:-true}
      CELERY_REDIS_RETRY_ON_TIMEOUT: ${CELERY_REDIS_RETRY_ON_TIMEOUT:-true}
      CELERY_REDIS_HEALTH_CHECK_INTERVAL: ${CELERY_REDIS_HEALTH_CHECK_INTERVAL:-25}
      CELERY_BROKER_CONNECTION_MAX_RETRIES: ${CELERY_BROKER_CONNECTION_MAX_RETRIES:-0}
      OPENFARM_LOG_FILE: ${OPENFARM_LOG_DIR:-/data/logs}/decloud.log
    volumes:
      - scratch:/data/scratch
      - ${OPENFARM_LOG_HOST_DIR:-./logs}:/data/logs
      - ${UNCRTAINTS_HOME_HOST:-/workspace/UnCRtainTS}:/opt/UnCRtainTS:ro
      - ${UNCRTAINTS_CHECKPOINT_HOST:-/workspace/UnCRtainTS/checkpoints}:/models/uncrtaints:ro
    command: >
      celery -A app.worker worker
      -Q decloud
      -n decloud@%h
      --loglevel=info
      --concurrency=2

  storage:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    env_file:
      - .env
    command: >
      celery -A app.worker worker
      -Q storage
      -n storage@%h
      --loglevel=info
      --concurrency=2
  # 单实例调度（ingest 镜像，celery -A app.beat）。多台下载机不要同时起 beat，
  # 否则周任务和日任务会重复投递。
  beat:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      CLOUDAMQP_RESULT_PUBLISH: ${CLOUDAMQP_RESULT_PUBLISH:-0}
      API_BASE_URL: ${API_BASE_URL:-}
      API_PATH_PREFIX: ${API_PATH_PREFIX-/v1}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SCHEDULE_DECLOUD_OUTBOX_ENABLED: ${SCHEDULE_DECLOUD_OUTBOX_ENABLED:-true}

  mq_consumer:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    environment:
      # Claim mode (WORK_QUEUE_MODE=claim): poll API; REDIS_URL stays localhost Celery.
      API_BASE_URL: ${API_BASE_URL:-}
      API_PATH_PREFIX: ${API_PATH_PREFIX-/v1}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # 每台下载机必须配置唯一机器名，claim 与管理员心跳都使用它标识机器。
      WORKER_NAME: ${WORKER_NAME:-}
      WORKER_ID: ${WORKER_ID:-}
      WORK_CLAIM_INTERVAL_SEC: ${WORK_CLAIM_INTERVAL_SEC:-4}
      # 本机积压（各队列就绪+unacked）≥ 该值时暂停领取，低于后自动恢复；0 = 不限制
      WORK_CLAIM_MAX_LOCAL_BACKLOG: ${WORK_CLAIM_MAX_LOCAL_BACKLOG:-100}
      # 领取上限只统计这些队列（就绪 + 路由到它们的 unacked）；decloud 等下游不计
      WORK_CLAIM_BACKLOG_QUEUES: ${WORK_CLAIM_BACKLOG_QUEUES:-satellite_download}
      # 暂停领取期间向生产上报存活的间隔（秒）
      WORK_CLAIM_PAUSED_HEARTBEAT_SEC: ${WORK_CLAIM_PAUSED_HEARTBEAT_SEC:-30}
      # Short connect timeout + retries + watchdog so gateway TLS flakes cannot stall claim for minutes
      WORK_CLAIM_HTTP_TIMEOUT_SEC: ${WORK_CLAIM_HTTP_TIMEOUT_SEC:-20}
      WORK_CLAIM_HTTP_CONNECT_TIMEOUT_SEC: ${WORK_CLAIM_HTTP_CONNECT_TIMEOUT_SEC:-5}
      WORK_CLAIM_HTTP_RETRIES: ${WORK_CLAIM_HTTP_RETRIES:-3}
      WORK_CLAIM_HTTP_RETRY_BACKOFF_SEC: ${WORK_CLAIM_HTTP_RETRY_BACKOFF_SEC:-0.5}
      WORK_CLAIM_WATCHDOG_SEC: ${WORK_CLAIM_WATCHDOG_SEC:-90}
      # 上报本机各 Celery ready 队列的待处理数量。
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-cpu_compute}
      CELERY_QUEUE_NAMES: ${CELERY_QUEUE_NAMES:-satellite_download,cpu_compute,ingest,decloud,storage}
      WORK_QUEUE_MODE: ${WORK_QUEUE_MODE:-claim}
      WORK_LEASE_SECONDS: ${WORK_LEASE_SECONDS:-600}
      # Celery broker must be local Redis on download host (not API Redis).
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      CLOUDAMQP_RESULT_PUBLISH: ${CLOUDAMQP_RESULT_PUBLISH:-0}
