# Download machine: host networking; optional local Redis for Celery only.
# Primary control plane (D1+): HTTP claim → API (no MQ required).
# See docs/design/download-host-no-direct-pg-redis.md
#
# Cutover runbook: docs/design/work-queue-cutover.md
# Usage (legacy MQ still default until WORK_QUEUE_MODE=claim):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.download-machine.yml --profile consumer \
#     up -d --build ingest storage beat mq_consumer decloud
#
# REDIS_URL on this host MUST be localhost (Celery broker), never API :6379.
# Internal HTTP (D2 reads + optional D1 claim) — set in .env:
#   API_BASE_URL=http://<api-lb>:8000
#   INTERNAL_API_TOKEN=<same as API>
#   WORKER_ID=download-1
#   WORK_CLAIM_INTERVAL_SEC=4
#   WORK_QUEUE_MODE=claim   # optional; leave legacy until cutover (do not force)
# ingest/mq_consumer also use API_BASE_URL for field/agri/job reads (D2)
# and assessment/season-growth bundles + weather/soil geom (D4.1).
#
# Secrets stay in .env / docker-compose.dev.yml — never hard-code credentials here.

services:
  db:
    profiles: ["local-db"]
  redis:
    profiles: ["local-redis"]
  api:
    profiles: ["api"]
  web:
    profiles: ["web"]
  mq_result_writer:
    profiles: ["producer"]

  ingest:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    environment:
      # D2: prefer internal HTTP reads when set (writes still use DATABASE_URL until D3)
      API_BASE_URL: ${API_BASE_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # D3: keep 1 until cutover; set 0 to force HTTP job/result writes
      INGEST_PG_WRITES: ${INGEST_PG_WRITES:-1}
      INGEST_HTTP_WRITES: ${INGEST_HTTP_WRITES:-0}
      MPLCONFIGDIR: /tmp/matplotlib
      SYNC_DB_POOL_SIZE: "8"
      SYNC_DB_MAX_OVERFLOW: "8"
      SYNC_DB_POOL_RECYCLE: "300"
      SYNC_DB_APP_NAME: "download-ingest"
      INGEST_SCENE_MAX_WORKERS: "8"
    volumes:
      - scratch:/data/scratch
      - ${UNCRTAINTS_HOME_HOST:-/workspace/UnCRtainTS}:/opt/UnCRtainTS:ro
      - ${UNCRTAINTS_CHECKPOINT_HOST:-/workspace/UnCRtainTS/checkpoints}:/models/uncrtaints:ro
    command: >
      celery -A app.worker worker
      -Q ingest
      -n ingest@%h
      --loglevel=info
      --concurrency=2

  # Separate queue so UnCRtainTS runs while optical shards keep downloading.
  # Same image as ingest; env comes from compose base + .env (no secrets here).
  decloud:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      SYNC_DB_POOL_SIZE: "4"
      SYNC_DB_MAX_OVERFLOW: "4"
      SYNC_DB_POOL_RECYCLE: "300"
      SYNC_DB_APP_NAME: "download-decloud"
      INGEST_SCENE_MAX_WORKERS: "2"
      # Standalone service (not an ingest override) — must pass broker/DB explicitly.
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CELERY_BROKER_VISIBILITY_TIMEOUT: ${CELERY_BROKER_VISIBILITY_TIMEOUT:-7200}
      CELERY_REDIS_SOCKET_TIMEOUT: ${CELERY_REDIS_SOCKET_TIMEOUT:-5}
      CELERY_REDIS_SOCKET_CONNECT_TIMEOUT: ${CELERY_REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      CELERY_REDIS_SOCKET_KEEPALIVE: ${CELERY_REDIS_SOCKET_KEEPALIVE:-true}
      CELERY_REDIS_RETRY_ON_TIMEOUT: ${CELERY_REDIS_RETRY_ON_TIMEOUT:-true}
      CELERY_REDIS_HEALTH_CHECK_INTERVAL: ${CELERY_REDIS_HEALTH_CHECK_INTERVAL:-25}
      CELERY_BROKER_CONNECTION_MAX_RETRIES: ${CELERY_BROKER_CONNECTION_MAX_RETRIES:-0}
    volumes:
      - scratch:/data/scratch
      - ${UNCRTAINTS_HOME_HOST:-/workspace/UnCRtainTS}:/opt/UnCRtainTS:ro
      - ${UNCRTAINTS_CHECKPOINT_HOST:-/workspace/UnCRtainTS/checkpoints}:/models/uncrtaints:ro
    command: >
      celery -A app.worker worker
      -Q decloud
      -n decloud@%h
      --loglevel=info
      --concurrency=2

  storage:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    command: >
      celery -A app.worker worker
      -Q storage
      -n storage@%h
      --loglevel=info
      --concurrency=2
  beat:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
  mq_consumer:
    network_mode: host
    depends_on: !reset []
    restart: unless-stopped
    environment:
      # Claim mode (WORK_QUEUE_MODE=claim): poll API; REDIS_URL stays localhost Celery.
      API_BASE_URL: ${API_BASE_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      WORKER_ID: ${WORKER_ID:-}
      WORK_CLAIM_INTERVAL_SEC: ${WORK_CLAIM_INTERVAL_SEC:-4}
      WORK_QUEUE_MODE: ${WORK_QUEUE_MODE:-legacy}
      WORK_LEASE_SECONDS: ${WORK_LEASE_SECONDS:-600}
      # Celery broker must be local Redis on download host (not API Redis).
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
